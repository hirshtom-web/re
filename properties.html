<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link 
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" 
rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <title>Properties</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/property-card.css">
    <link rel="stylesheet" href="../css/properties-grid.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/properties-toolbar.css">
    <link rel="stylesheet" href="../css/properties-layout.css">
    <link rel="stylesheet" href="../css/mobile-search.css">
    <link rel="stylesheet" href="../css/header.css">


</head>



<body class="search-page">

<script src="../js/header.js"></script>

<script>
loadHeader("properties.html");
</script>

    
<section class="properties-section">

<!-- =========================
DESKTOP MAP + GRID
========================= -->


<div class="properties-layout">


    <div class="map-container">

        <div id="desktop-map"></div>

    </div>



    <div class="properties-scroll">


        <div 
        id="properties-grid"
        class="properties-grid">
        </div>


    </div>


</div>








<!-- =========================
MOBILE MAP + SHEETS
========================= -->

<div id="mobile-filters-root" class="mobile-map-layout">


    <div id="mobile-map"></div>


   <div id="map-property-preview" class="mobile-property-preview"></div>

    <button 
    class="mobile-filter-button"
    type="button">

    <span class="material-symbols-outlined filter-icon">
        tune
    </span>

    Filters

</button>



    <!-- PROPERTY SHEET -->

    <div class="property-sheet">


        <div class="sheet-header">

            <div class="sheet-handle"></div>

            <span id="property-count">
                248 Properties
            </span>

        </div>


        <div class="sheet-content">

            <div
                id="mobile-properties-grid"
                class="properties-grid">
            </div>

        </div>


    </div>





    <!-- FILTER SHEET -->

    <div class="filter-sheet mobile-filter-sheet">


        <div class="filter-sheet-handle"></div>


        <div class="filter-sheet-header">
            Filters
        </div>



        <div class="filter-content">



            <!-- SEARCH -->

<div class="mobile-filter-section">

    <h3>
        Search
    </h3>

    <div class="search-box mobile-search-box">

        <span class="material-symbols-outlined">
            search
        </span>

        <input
            id="mobile-property-search"
            type="text"
            placeholder="Search residences, buildings, locations...">

    </div>

</div>





            <!-- PRICE -->

            <!-- PRICE -->

<div class="mobile-filter-section">


    <h3>
        Price
    </h3>



    <!-- PRICE HISTOGRAM -->

    <div class="mobile-price-chart">

        <div style="height:15%"></div>
        <div style="height:30%"></div>
        <div style="height:55%"></div>
        <div style="height:80%"></div>
        <div style="height:100%"></div>
        <div style="height:85%"></div>
        <div style="height:60%"></div>
        <div style="height:35%"></div>
        <div style="height:20%"></div>

    </div>



    <!-- DOUBLE RANGE SLIDER -->

    <div class="mobile-range-slider">


        <div class="mobile-slider-track"></div>


        <input
            id="mobile-min-range"
            type="range"
            min="0"
            max="20000000"
            value="500000">


        <input
            id="mobile-max-range"
            type="range"
            min="0"
            max="20000000"
            value="10000000">


    </div>



    <!-- PRICE INPUTS -->

    <div class="mobile-price-range-values">


        <div class="price-input-group">

            <label>
                Minimum
            </label>

            <input
                id="mobile-min-price"
                type="text"
                value="$500,000">

        </div>



        <div class="price-input-group">

            <label>
                Maximum
            </label>

            <input
                id="mobile-max-price"
                type="text"
                value="$10,000,000">

        </div>


    </div>


</div>






            <!-- LOCATION -->

           <!-- LOCATION -->

<div class="mobile-filter-section">


    <h3>
        Location
    </h3>



    <div class="mobile-search-box mobile-location-search">


        <span class="material-symbols-outlined">
            search
        </span>


        <input
            id="mobile-location-search"
            type="text"
            placeholder="Search city, neighborhood, building...">


    </div>


                <div class="mobile-popup-options">


                    <button data-value="">
                        All Locations
                    </button>

                    <button data-value="Aventura">
                        Aventura
                    </button>

                    <button data-value="Bal Harbour">
                        Bal Harbour
                    </button>

                    <button data-value="Brickell">
                        Brickell
                    </button>

                    <button data-value="Brickell Key">
                        Brickell Key
                    </button>

                    <button data-value="Coconut Grove">
                        Coconut Grove
                    </button>

                    <button data-value="Coral Gables">
                        Coral Gables
                    </button>

                    <button data-value="Downtown Miami">
                        Downtown Miami
                    </button>

                    <button data-value="Miami Beach">
                        Miami Beach
                    </button>

                    <button data-value="Sunny Isles Beach">
                        Sunny Isles Beach
                    </button>

                    <button data-value="Wynwood Miami">
                        Wynwood Miami
                    </button>


                </div>


            </div>







            <!-- PROPERTY TYPE -->

           <!-- PROPERTY TYPE -->

<div class="mobile-filter-section">


    <h3>
        Property Type
    </h3>


    <button class="mobile-select-trigger">

        <span>
            All Property Types
        </span>

        <span class="material-symbols-outlined">
            keyboard_arrow_down
        </span>

    </button>



    <div class="mobile-popup-options">


        <button data-value="">
            All Property Types
        </button>


        <button data-value="New Construction">
            New Construction
        </button>


        <button data-value="Pre-Construction">
            Pre-Construction
        </button>


        <button data-value="Other">
            Other
        </button>


    </div>


</div>






            <!-- COMPLETION -->

            <!-- COMPLETED BY -->

<div class="mobile-filter-section">


    <h3>
        Completed By
    </h3>


    <button class="mobile-select-trigger">

        <span>
            Any
        </span>

        <span class="material-symbols-outlined">
            keyboard_arrow_down
        </span>

    </button>



    <div class="mobile-popup-options">


        <button data-value="">
            Any
        </button>


        <button data-value="2026">
            2026
        </button>


        <button data-value="2027">
            2027
        </button>


        <button data-value="2028">
            2028
        </button>


        <button data-value="2029">
            2029
        </button>


        <button data-value="2030">
            2030+
        </button>


    </div>


</div>






            <!-- SORT -->

           <!-- SORT BY -->

<div class="mobile-filter-section">


    <h3>
        Sort By
    </h3>


    <button class="mobile-select-trigger">

        <span>
            Default
        </span>

        <span class="material-symbols-outlined">
            keyboard_arrow_down
        </span>

    </button>



    <div class="mobile-popup-options">


        <button data-value="">
            Default
        </button>


        <button data-value="price-low">
            Price: Low to High
        </button>


        <button data-value="price-high">
            Price: High to Low
        </button>


        <button data-value="name">
            Name A-Z
        </button>


        <button data-value="location">
            Location
        </button>


    </div>


</div>



        </div>







        <div class="filter-sheet-footer">


            <button class="reset-filter mobile-reset-filter">
    Reset
</button>


<button class="apply-filter mobile-apply-filter">
    Apply Filters
</button>


        </div>



    </div>


</div>    
    

    
    <div class="modal" id="dealModal">

    <div class="modal-content">

        <div class="modal-header">

            <div class="modal-left">

                <button class="modal-btn" onclick="closeDeal()">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M15 18L9 12L15 6"/>
</svg>

Back

</button>

            </div>

            <div class="modal-center">

                <img
                    class="modal-logo"
                    src="https://static.wixstatic.com/shapes/1799ca_7155831ea6c34da28a5a12b76fe72255.svg"
                    alt="Logo">

            </div>

           <div class="modal-right">

<button class="icon-btn" onclick="downloadPDF()">
    <span class="material-symbols-outlined">picture_as_pdf</span>
</button>


<div class="menu-wrapper">

    <button class="icon-btn" onclick="toggleMenu()">
        <span class="material-symbols-outlined">more_vert</span>
    </button>


    <div id="moreMenu" class="more-menu">


        <button onclick="whatsappBroker()">
            <span class="material-symbols-outlined">chat</span>
            WhatsApp
        </button>


        <button onclick="callBroker()">
            <span class="material-symbols-outlined">call</span>
            Call
        </button>


        <button onclick="emailBroker()">
            <span class="material-symbols-outlined">mail</span>
            Email
        </button>


        <hr>


        <button onclick="shareDeal()">
            <span class="material-symbols-outlined">share</span>
            Share
        </button>


        <button onclick="copyLink()">
            <span class="material-symbols-outlined">content_copy</span>
            Copy Link
        </button>


        <button onclick="visitWebsite()">
            <span class="material-symbols-outlined">language</span>
            Website
        </button>


</div>

</div>

</div>

</div>

<iframe id="dealFrame"></iframe>

</div>

</div> 


    
<script src="../data/properties.js"></script>

<script src="../js/properties-grid.js"></script>


<!-- Map must load before search updates markers -->
<script src="../js/properties-map.js"></script>

<script>
function loadGoogleMaps(){

    const script=document.createElement("script");

    script.src =
    "https://maps.googleapis.com/maps/api/js?key=AIzaSyApjRl527xXbpu2WN_c2E-mVvJhJAzkAC8&callback=initMap&loading=async&v=weekly";

    script.async=true;
    script.defer=true;

    document.head.appendChild(script);

}

loadGoogleMaps();
</script>
    
<!-- Search needs renderPropertiesGrid + updateMapMarkers -->
<script src="../js/properties-search.js"></script>


<!-- View toggle -->
<script src="../js/properties-filters-mobile.js"></script>
<script src="../js/properties-toolbar.js"></script>
<script src="../js/properties-view.js"></script>


<!-- Modal and contacts -->
<script src="../js/modal.js"></script>
<script src="../js/contact.js"></script>


    
</body>

</html>
