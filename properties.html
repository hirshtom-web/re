<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
    
    <title>Properties</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/property-card.css">
    <link rel="stylesheet" href="../css/properties-grid.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/properties-toolbar.css">

</head>


<body>


    <section class="properties-toolbar">

    <div class="search-box">

        <span class="material-symbols-rounded">
            search
        </span>

        <input
        id="property-search"
        type="text"
        placeholder="Search residences, buildings, locations..."
        >

    </div>


    <div class="filter-group">

        <select id="location-filter">

            <option value="">
                Location
            </option>

            <option value="Miami Beach">
                Miami Beach
            </option>

            <option value="Brickell">
                Brickell
            </option>

            <option value="Downtown Miami">
                Downtown Miami
            </option>

            <option value="Sunny Isles Beach">
                Sunny Isles Beach
            </option>

        </select>



        <select id="price-filter">

            <option value="">
                Price Range
            </option>

            <option value="1">
                Under $2M
            </option>

            <option value="2">
                $2M - $5M
            </option>

            <option value="3">
                $5M+
            </option>

        </select>



        <select id="sort-filter">

            <option value="">
                Sort By
            </option>

            <option value="price-low">
                Price: Low to High
            </option>

            <option value="price-high">
                Price: High to Low
            </option>

            <option value="name">
                Name A-Z
            </option>

            <option value="location">
                Location
            </option>

        </select>


    </div>


</section>

    
<div id="property-map"></div>


    
<section class="properties-grid-section">

    <div 
    id="properties-grid"
    class="properties-grid">
    </div>

</section>

    



    
    <div class="modal" id="dealModal">

    <div class="modal-content">

        <div class="modal-header">

            <div class="modal-left">

                <button class="modal-btn" onclick="closeDeal()">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M15 18L9 12L15 6"/>
</svg>

Back

</button>

            </div>

            <div class="modal-center">

                <img
                    class="modal-logo"
                    src="https://static.wixstatic.com/shapes/1799ca_7155831ea6c34da28a5a12b76fe72255.svg"
                    alt="Logo">

            </div>

           <div class="modal-right">

<button class="icon-btn" onclick="downloadPDF()">
<span class="material-symbols-rounded">picture_as_pdf</span>
</button>

<div class="menu-wrapper">

<button class="icon-btn" onclick="toggleMenu()">
<span class="material-symbols-rounded">more_vert</span>
</button>

<div id="moreMenu" class="more-menu">

<button onclick="whatsappBroker()">
<span class="material-symbols-rounded">chat</span>
WhatsApp
</button>

<button onclick="callBroker()">
<span class="material-symbols-rounded">call</span>
Call
</button>

<button onclick="emailBroker()">
<span class="material-symbols-rounded">mail</span>
Email
</button>

<hr>

<button onclick="shareDeal()">
<span class="material-symbols-rounded">share</span>
Share
</button>

<button onclick="copyLink()">
<span class="material-symbols-rounded">content_copy</span>
Copy Link
</button>

<button onclick="visitWebsite()">
<span class="material-symbols-rounded">language</span>
Website
</button>

</div>

</div>

</div>

</div>

<iframe id="dealFrame"></iframe>

</div>

</div> 


<script src="../data/properties-data.js"></script>
<script src="../data/properties-grid.js"></script>
<script src="../data/properties-page.js"></script>
<script src="../data/property-page.js"></script>

<script src="../js/modal.js"></script>
<script src="../js/contact.js"></script>

    



    
</body>

</html>
