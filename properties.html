<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link 
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" 
rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <title>Properties</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/property-card.css">
    <link rel="stylesheet" href="../css/properties-grid.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/properties-toolbar.css">
    <link rel="stylesheet" href="../css/properties-layout.css">

</head>


<body>




<section class="properties-section">


<!-- =========================
DESKTOP FILTERS
========================= -->

<div class="desktop-filters">


<div class="properties-toolbar">


    <!-- SEARCH -->

    <div class="search-box">

        <span class="material-symbols-outlined">
            search
        </span>

        <input
        id="property-search"
        type="text"
        placeholder="Search residences, buildings, locations..."
        >

    </div>



    <!-- FILTERS -->

    <div class="filter-group">


         <!-- LOCATION -->

        <select id="location-filter">

            <option value="">
                All Locations
            </option>

            <option value="Aventura">
                Aventura
            </option>

            <option value="Bal Harbour">
                Bal Harbour
            </option>

            <option value="Bay Harbor Islands">
                Bay Harbor Islands
            </option>

            <option value="Boca Raton">
                Boca Raton
            </option>

            <option value="Brickell">
                Brickell
            </option>

            <option value="Brickell Key">
                Brickell Key
            </option>

            <option value="Coconut Grove">
                Coconut Grove
            </option>

            <option value="Coral Gables">
                Coral Gables
            </option>

            <option value="Downtown Miami">
                Downtown Miami
            </option>

            <option value="Edgewater">
                Edgewater
            </option>

            <option value="Fisher Island">
                Fisher Island
            </option>

            <option value="Fort Lauderdale">
                Fort Lauderdale
            </option>

            <option value="Hallandale Beach">
                Hallandale Beach
            </option>

            <option value="Hollywood">
                Hollywood
            </option>

            <option value="Miami Beach">
                Miami Beach
            </option>

            <option value="Miami River">
                Miami River
            </option>

            <option value="Midtown Miami">
                Midtown Miami
            </option>

            <option value="North Bay Village">
                North Bay Village
            </option>

            <option value="North Miami">
                North Miami
            </option>

            <option value="North Miami Beach">
                North Miami Beach
            </option>

            <option value="Palm Beach">
                Palm Beach
            </option>

            <option value="Palm Beach Gardens">
                Palm Beach Gardens
            </option>

            <option value="Pompano Beach">
                Pompano Beach
            </option>

            <option value="South Beach">
                South Beach
            </option>

            <option value="Sunny Isles Beach">
                Sunny Isles Beach
            </option>

            <option value="Surfside">
                Surfside
            </option>

            <option value="West Palm Beach">
                West Palm Beach
            </option>

            <option value="Wynwood Miami">
                Wynwood Miami
            </option>

        </select>





       <!-- PRICE -->
<div class="price-filter-wrapper">


    <button id="price-filter">

        Price

    </button>



    <div class="price-popup">


        <div class="price-range-values">


            <input 
            id="min-price"
            type="number"
            value="500000">


            <input 
            id="max-price"
            type="number"
            value="10000000">


        </div>



        <div class="range-slider">


            <div class="slider-track"></div>


            <input
            id="min-range"
            type="range"
            min="0"
            max="20000000"
            value="500000">


            <input
            id="max-range"
            type="range"
            min="0"
            max="20000000"
            value="10000000">


        </div>



        <div class="price-chart">


            <div style="height:20%"></div>
            <div style="height:45%"></div>
            <div style="height:80%"></div>
            <div style="height:100%"></div>
            <div style="height:60%"></div>
            <div style="height:30%"></div>


        </div>


    </div>


</div>



         <!-- PROPERTY TYPE -->


        <select id="property-type-filter">

            <option value="">
                All Property Types
            </option>

            <option value="New Construction">
                New Construction
            </option>

            <option value="Pre-Construction">
                Pre-Construction
            </option>

            <option value="Other">
                Other
            </option>

        </select>





         <!-- COMPLETION -->


        <select id="completion-filter">

            <option value="">
                Completed By
            </option>

            <option value="2026">
                2026
            </option>

            <option value="2027">
                2027
            </option>

            <option value="2028">
                2028
            </option>

            <option value="2029">
                2029
            </option>

            <option value="2030">
                2030+
            </option>

        </select>




        <!-- SORT -->


        <select id="sort-filter">

            <option value="">
                Sort By
            </option>

            <option value="price-low">
                Price: Low to High
            </option>

            <option value="price-high">
                Price: High to Low
            </option>

            <option value="name">
                Name A-Z
            </option>

            <option value="location">
                Location
            </option>

        </select>

        


    </div>


</div>


</div>





<!-- =========================
DESKTOP MAP + GRID
========================= -->


<div class="properties-layout">


    <div class="map-container">

        <div id="desktop-map"></div>

    </div>



    <div class="properties-scroll">


        <div 
        id="properties-grid"
        class="properties-grid">
        </div>


    </div>


</div>








<!-- =========================
MOBILE MAP + SHEETS
========================= -->


<div class="mobile-map-layout">


    <!-- FULL SCREEN MOBILE MAP -->

    <div id="mobile-map"></div>





    <!-- FILTER BUTTON -->

    <button 
    class="mobile-filter-button"
    onclick="openFilters()">

        ⚙ Filters

    </button>






    <!-- PROPERTY BOTTOM SHEET -->

    <div class="property-sheet">

    <div class="sheet-header">

        <div class="sheet-handle"></div>

        <span id="property-count">
            248 Properties
        </span>

    </div>


        <div class="sheet-content">


            <div 
            id="mobile-properties-grid"
            class="properties-grid">
            </div>


        </div>


    </div>







    <!-- FILTER POPUP SHEET -->

    <div class="filter-sheet">

    <div class="sheet-handle"></div>

    <div class="sheet-header">
        Filters
    </div>

    <div class="filter-content">

        <!-- your filters here -->

    </div>

</div>


    </div> <!-- CLOSE mobile-map-layout -->

</section>


    
    

    
    <div class="modal" id="dealModal">

    <div class="modal-content">

        <div class="modal-header">

            <div class="modal-left">

                <button class="modal-btn" onclick="closeDeal()">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M15 18L9 12L15 6"/>
</svg>

Back

</button>

            </div>

            <div class="modal-center">

                <img
                    class="modal-logo"
                    src="https://static.wixstatic.com/shapes/1799ca_7155831ea6c34da28a5a12b76fe72255.svg"
                    alt="Logo">

            </div>

           <div class="modal-right">

<button class="icon-btn" onclick="downloadPDF()">
    <span class="material-symbols-outlined">picture_as_pdf</span>
</button>


<div class="menu-wrapper">

    <button class="icon-btn" onclick="toggleMenu()">
        <span class="material-symbols-outlined">more_vert</span>
    </button>


    <div id="moreMenu" class="more-menu">


        <button onclick="whatsappBroker()">
            <span class="material-symbols-outlined">chat</span>
            WhatsApp
        </button>


        <button onclick="callBroker()">
            <span class="material-symbols-outlined">call</span>
            Call
        </button>


        <button onclick="emailBroker()">
            <span class="material-symbols-outlined">mail</span>
            Email
        </button>


        <hr>


        <button onclick="shareDeal()">
            <span class="material-symbols-outlined">share</span>
            Share
        </button>


        <button onclick="copyLink()">
            <span class="material-symbols-outlined">content_copy</span>
            Copy Link
        </button>


        <button onclick="visitWebsite()">
            <span class="material-symbols-outlined">language</span>
            Website
        </button>


</div>

</div>

</div>

</div>

<iframe id="dealFrame"></iframe>

</div>

</div> 


<script src="../data/properties.js"></script>


<!-- Render cards -->
<script src="../js/properties-grid.js"></script>


<!-- Map must load before search updates markers -->
<script src="../js/properties-map.js"></script>

    <script>
function loadGoogleMaps() {
  const script = document.createElement("script");
  script.src =
    "https://maps.googleapis.com/maps/api/js?key=AIzaSyApjRl527xXbpu2WN_c2E-mVvJhJAzkAC8&callback=initMap&loading=async";
  script.async = true;
  script.defer = true;
  document.head.appendChild(script);
}

loadGoogleMaps();
</script>

<!-- Search needs renderPropertiesGrid + updateMapMarkers -->
<script src="../js/properties-search.js"></script>


<!-- View toggle -->
<script src="../js/properties-view.js"></script>
<script src="../js/properties-toolbar.js"></script>


<!-- Modal and contacts -->
<script src="../js/modal.js"></script>
<script src="../js/contact.js"></script>

    



    
</body>

</html>
