<!DOCTYPE html>
<html>
<head>

<title>Listings Test</title>

<style>

body{
    font-family: Arial;
    padding:40px;
}

.card{
    border:1px solid #ddd;
    padding:20px;
    border-radius:12px;
    margin:15px 0;
}

</style>

</head>


<body>

<h1>Properties</h1>

<div id="listings"></div>


<script>

fetch("http://127.0.0.1:8000/listings")
.then(response => {
    console.log("response received");
    return response.json();
})
.then(data => {

    console.log(data);

    document.getElementById("listings").innerHTML =
        JSON.stringify(data);

})
.catch(error => {

    console.log("ERROR:", error);

});

</script>

</body>
</html>
