<!DOCTYPE html>
<html>
<body>

<h1>Properties</h1>

<div id="listings"></div>

<script>
fetch("http://127.0.0.1:8000/listings")
.then(response => response.json())
.then(data => {

    document.getElementById("listings").innerHTML =
        data.map(property => `
            <h2>${property.address}</h2>
            <p>Price: $${property.price}</p>
            <p>Beds: ${property.beds}</p>
            <p>Baths: ${property.baths}</p>
        `).join("");

});
</script>

</body>
</html>
