<!DOCTYPE html>
<html lang="en">

    
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI</title>

    <!-- Main website styles -->
    <link rel="stylesheet" href="../css/main.css">

    <!-- Hero styles -->
    <link rel="stylesheet" href="../css/hero.css">

    <!-- Journal page styles -->
    <link rel="stylesheet" href="../css/blog.css">

    <!-- Header styles -->
    <link rel="stylesheet" href="../css/header.css">

     <!-- Header styles -->
    <link rel="stylesheet" href="../css/ai-page.css">

<link 
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" 
rel="stylesheet">
<link
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
rel="stylesheet">


</head>

    
<body>

    
<main class="journal-page">



    
<header class="site-header">

    <div class="site-header-left">
        <a href="/" class="site-logo">
            <img src="../assets/logo.svg" alt="Logo">
        </a>
    </div>


    <div class="site-header-center">

    </div>


    <div class="site-header-right">

    <!-- Desktop -->
    <button class="desktop-toggle">
        <span class="material-symbols-outlined">menu</span>
    </button>

    <!-- Mobile -->
    <button class="mobile-toggle">
        <span class="material-symbols-outlined">menu</span>
    </button>

</div>

</header>


<main class="ai-search-page">


<header class="site-header">

    <div class="site-header-left">
        <a href="/" class="site-logo">
            <img src="../assets/logo.svg">
        </a>
    </div>


    <div class="site-header-right">

        <button class="desktop-toggle">
            <span class="material-symbols-outlined">
                menu
            </span>
        </button>

    </div>

</header>



<section class="ai-search-hero">


<div class="ai-glow glow-one"></div>
<div class="ai-glow glow-two"></div>
<div class="ai-glow glow-three"></div>



<div class="ai-search-content">


<div class="ai-badge">

<span class="material-symbols-outlined">
auto_awesome
</span>

Rility AI Property Search

</div>



<h1>

Find your next
<span>Florida residence</span>

</h1>


<p id="ai-changing-line">
Searching luxury homes, condos and investment opportunities...
</p>



<div class="ai-search-box">


<span class="material-symbols-outlined">
search
</span>


<input 
id="aiInput"
placeholder="Ask anything about Florida real estate..."
>


<button>
Search
</button>


</div>


</div>


</section>


</main>


<script src="../js/blog.js"></script>


</body>

</html>
