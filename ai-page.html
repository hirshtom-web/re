<!DOCTYPE html>
<html lang="en">

    
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title></title>

    <!-- Main website styles -->
    <link rel="stylesheet" href="../css/main.css">

    <!-- Hero styles -->
    <link rel="stylesheet" href="../css/hero.css">

    <!-- Journal page styles -->
    <link rel="stylesheet" href="../css/blog.css">

    <!-- Header styles -->
    <link rel="stylesheet" href="../css/header.css">

     <!-- Header styles -->
    <link rel="stylesheet" href="../css/ai-page.css">

<link 
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" 
rel="stylesheet">
<link
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
rel="stylesheet">


</head>

    
<body>

    
<main class="ai-page">



<section class="ai-search-hero">


<div class="ai-glow glow-one"></div>
<div class="ai-glow glow-two"></div>
<div class="ai-glow glow-three"></div>



<div class="ai-search-content">


<div class="ai-badge">

<span class="material-symbols-outlined">
auto_awesome
</span>

Rility AI Property Search

</div>



<h1>

Find your next
<span>Florida residence</span>

</h1>


<p id="ai-changing-line">
Searching luxury homes, condos and investment opportunities...
</p>



<div class="ai-search-box">

    <span class="material-symbols-outlined">
        search
    </span>

    <input 
        id="aiInput"
        placeholder="Ask anything about Florida real estate..."
    >

    <button id="aiSend">
        Search
    </button>

</div>


<div id="ai-chat" class="ai-chat">

    <div id="ai-messages" class="ai-messages"></div>

    <div class="ai-chat-input">

        <input 
        id="chatInput"
        placeholder="Ask another question..."
        >

        <button id="chatSend">
            Send
        </button>

    </div>

</div>

</div>


</section>


</main>

<script src="../js/header.js"></script>
<script>
loadHeader();
</script>
    
<script src="../js/global.js"></script>


</body>

</html>
